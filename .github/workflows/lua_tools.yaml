name: Build and Release
on:
  workflow_dispatch:
jobs:
  get-data:
    name: Read Cargo TOML
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@master
      - name: Read Cargo TOML
        uses: SebRollen/toml-action@v1.0.2
        id: read_toml
        with:
          file: "./lua51-deserializer/Cargo.toml"
          field: "package.version"
    outputs:
      version: ${{ steps.read_toml.outputs.value }}

  draft-release:
    name: Create a draft release
    runs-on: ubuntu-latest
    needs: get-data
    permissions:
      contents: write
    steps:
      - name: Push Tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ${{ needs.get-data.outputs.version }}
      - name: Create Release
        uses: ncipollo/release-action@v1.14.0
        with:
          draft: true
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
    outputs:
      tag: ${{ steps.tag_version.outputs.new_tag }}

  build:
    name: Build ${{ matrix.project }}
    runs-on: ubuntu-latest
    needs: draft-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: lua51-deserializer
            artifact_name: lua51-deserializer-aarch64-linux-musl
          - project: lua51-lifter
            artifact_name: lua51-lifter-aarch64-linux-musl
          - project: luau-lifter
            artifact_name: luau-lifter-aarch64-linux-musl
          - project: luau-worker
            artifact_name: luau-worker-aarch64-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@master
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          target: aarch64-unknown-linux-musl
          profile: minimal
          toolchain: nightly
          override: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./${{ matrix.project }} -> target"
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Build binary
        run: cross build -p ${{ matrix.project }} --release --target aarch64-unknown-linux-musl
      - name: Rename artifact
        shell: bash
        run: |
          ARTIFACT_DIR="target/aarch64-unknown-linux-musl/release"
          mv "${ARTIFACT_DIR}/${{ matrix.project }}" "${ARTIFACT_DIR}/${{ matrix.artifact_name }}"
      - name: Upload release asset
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/aarch64-unknown-linux-musl/release/${{ matrix.artifact_name }}
          asset_name: ${{ matrix.artifact_name }}
          tag: ${{ needs.draft-release.outputs.tag }}
          overwrite: true
